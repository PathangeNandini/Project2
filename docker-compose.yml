version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: omnipos-mongo
    restart: always
    ports:
      - "27017:27017"
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}) }" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  mongo-init-replica:
    image: mongo:7
    depends_on:
      - mongodb
    entrypoint: >
      bash -c "
        sleep 5 &&
        mongosh --host mongodb:27017 --eval '
          try {
            rs.status()
          } catch (err) {
            rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongodb:27017\"}]})
          }
        '
      "

  redis:
    image: redis:7-alpine
    container_name: omnipos-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mongo-data: